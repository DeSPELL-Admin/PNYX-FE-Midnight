packages:
  - "."

# pnpm 10/11은 package.json 의 pnpm.overrides 를 더 이상 읽지 않는다.
# 공급망 공격 대응 보안 핀은 여기(pnpm-workspace.yaml overrides)가 정식 자리.
overrides:
  backslash: 0.2.0
  chalk-template: 1.1.0
  supports-hyperlinks: 4.1.0
  has-ansi: 6.0.0
  simple-swizzle: 0.2.2
  color-string: 2.1.0
  error-ex: 1.3.2
  color-name: 2.0.0
  is-arrayish: 0.3.2
  slice-ansi: 7.1.0
  color-convert: 3.1.0
  wrap-ansi: 9.0.0
  ansi-regex: 6.2.0
  supports-color: 10.2.0
  strip-ansi: 7.1.0
  chalk: 5.6.0
  ansi-styles: 6.2.1
  # 중복 제거: viem 3개 버전(2.23.2 + 2.43.3 ×2) → 단일화. zod 3.x 도 통일해
  # viem 의 peer 분기로 생긴 중복까지 제거(zod 4.x 는 건드리지 않음).
  viem: 2.43.3
  "zod@3": 3.25.76

allowBuilds:
  "@nestjs/core": true
  "@openapitools/openapi-generator-cli": true
  "esbuild": true
  "protobufjs": true
  "sharp": true
  "blake-hash": false
  "bufferutil": false
  "keccak": false
  "tiny-secp256k1": false
  "unrs-resolver": false
  "usb": false
  "utf-8-validate": false
  '@parcel/watcher': set this to true or false
  '@swc/core': set this to true or false
  msgpackr-extract: set this to true or false
